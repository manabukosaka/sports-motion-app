[project]
name = "motion-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.22",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pydantic>=2.12",
    "referencing>=0.35",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["hypothesis", "mypy", "pytest", "ruff", "scipy-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
