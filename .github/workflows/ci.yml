name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:contracts
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - run: uv run --no-project --with jsonschema python scripts/test-contracts.py
      - run: pwsh -NoProfile -File scripts/test-evidence-catalog.ps1

  verify-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:g3
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - run: uv lock --project services/motion-engine --check
      - run: uv run --project services/motion-engine --frozen python scripts/test-license-gate.py --self-test
      - run: uv run --project services/motion-engine --frozen mypy services/motion-engine/src
      - run: uv run --project services/motion-engine --frozen ruff check services/motion-engine/src evals/biomechanics scripts/test-license-gate.py
      - run: uv run --project services/motion-engine --frozen pytest evals/biomechanics/tests

  ts-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run check:boundaries
      - run: pnpm run check:boundaries:self-test
      - run: pnpm run test:evidence
      - run: pnpm run test:export
      - run: pnpm run test:editing
      - run: pnpm run test

  verify-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:lifecycle

  vertical-slice-api-worker:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sports-motion-vertical-slice-venv
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/motion-engine --frozen
      - run: pnpm run test:vertical-slice

  walking-skeleton-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: uv sync --project services/motion-engine --frozen
      - run: pnpm run test:walking-skeleton-e2e

  verify-access-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm run verify:access-policy

  biomech-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - run: uv run --project services/motion-engine --frozen python evals/biomechanics/run_eval.py

  worktree-tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-worktree.ps1
